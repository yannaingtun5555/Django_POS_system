{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ shop_name }} - Login</title>
  <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
</head>
<body>
  <div class="background-accent"></div>
  
  <div class="login-card">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    
    <h1 class="title">{{ shop_name }}</h1>
    <p class="subtitle">Sign in to access your point of sale system</p>
    
    <div class="divider"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">USERNAME</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username">
        </div>
      </div>
      
      <div class="form-group">
        <div class="password-header">
          <label class="form-label" for="password">PASSWORD</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password">
        </div>
      </div>
      
      <div id="form-status" class="form-status"></div>
      
      <button type="submit" id="submit-button" class="submit-btn">Sign In</button>
    </form>
    
    <div class="footer-divider"></div>
    <p class="footer-text">&copy; 2024 {{ shop_name }}. All rights reserved.</p>
  </div>
  <script src="{% static 'core/js/login.js' %}"></script>
</body>
</html>
