{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - {{ shop_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/settings.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <span class="brand-name">{{ shop_name }}</span>
        </div>
        <div class="nav-links">
            <a href="{% url 'dashboard-page' %}" class="nav-link">Dashboard</a>
            <a href="{% url 'sale-page' %}" class="nav-link">POS</a>
            <a href="{% url 'inventory-page' %}" class="nav-link">Inventory</a>
            <a href="{% url 'purchase-page' %}" class="nav-link">Purchases</a>
            <a href="{% url 'report' %}" class="nav-link">Reports</a>
            <a href="{% url 'history-page' %}" class="nav-link">History</a>
            <a href="{% url 'setting-page' %}" class="nav-link active">Settings</a>
        </div>
        <div class="nav-right">
            <button class="notification-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-dot"></span>
            </button>
            <div class="user-profile">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header-actions">
            <button class="btn btn-primary" id="addUserBtn">+ Add User</button>
            <button class="btn btn-outline" id="reportBugBtn">Report Bug</button>
            <button class="btn btn-logout" id="logoutBtn">Logout</button>
        </div>
        <!-- General Settings Section -->
        <section class="settings-section">
            <div class="section-header">
                <h2>General Settings</h2>
                <p>Manage your store details and preferences.</p>
            </div>
            
            <div class="settings-form">
                <div class="form-group-row">
                    <div class="avatar-section">
                        <div class="store-avatar">MB</div>
                    </div>
                    <div class="form-fields">
                        <div class="form-group">
                            <label for="shopName">Store Name</label>
                            <input type="text" id="shopName" class="form-input" placeholder="Store Name">
                        </div>
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <select id="currency" class="form-input">
                                <option value="K">MMK (K)</option>
                                <option value="$">USD ($)</option>
                                <option value="€">EUR (€)</option>
                                <option value="£">GBP (£)</option>
                                <option value="¥">JPY (¥)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" id="saveChangesBtn">Save Changes</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Add User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New User</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="userForm" class="modal-form">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" required>
                </div>
                <div class="form-group">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="optional">
                </div>
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="role">Role *</label>
                    <select id="role" name="role" class="form-input" required>
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="staff">Staff</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>
                <div id="userMessage" class="message"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <script>
        window.APP_CONFIG = {
            shopName: "{{ shop_name|escapejs }}",
            currencyPrefix: "{{ currency_prefix|escapejs }}",
            currencyPostfix: "{{ currency_postfix|escapejs }}"
        };
    </script>
    <script src="{% static 'core/js/settings.js' %}"></script>
</body>
</html>
